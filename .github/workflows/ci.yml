name: Skill validation
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Install declared Python dependencies
        run: python -m pip install -e '.[localization,analysis,assets]'
      - name: Run synthetic and isolated tests (no installed game)
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build and inspect the committed Skill distribution
        run: python scripts/package_skill.py --output (Join-Path $env:RUNNER_TEMP 'aow4-mod-audit-distribution')
